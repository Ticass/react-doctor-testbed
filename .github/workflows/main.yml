name: react-doctor

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run full scan
        id: scan
        run: npx -y react-doctor-rewritten@0.2.9 . --hide-branding > report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-doctor-full-report
          path: report.html

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/comment-report.cjs');
            await run({ github, context, core });
        env:
          MARKER: "<!-- react-doctor-thread:full -->"
          ARTIFACT_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  pr-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run PR scan
        id: scan
        run: npx -y react-doctor-rewritten@0.2.9 . --hide-branding-pr > report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-doctor-pr-report
          path: report.html

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/comment-report.cjs');
            await run({ github, context, core });
        env:
          MARKER: "<!-- react-doctor-thread:pr -->"
          ARTIFACT_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"